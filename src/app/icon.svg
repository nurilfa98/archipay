<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo ArchiPay: huruf "A" berbentuk atap (project) + koin emas (uang).
       Versi React-nya ada di src/components/layout/logo-mark.tsx; ubah keduanya bersamaan.
       Setelah diubah, buat ulang ikon PNG: pnpm icons:generate
       Script itu mencari radius sudut 112 dan grup ber-id "mark", jadi keduanya jangan diubah. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="shine" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <g id="mark">
    <path d="M140 384 L256 128 L372 384" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="318" r="42" fill="url(#coin)"/>
    <circle cx="256" cy="318" r="27" fill="none" stroke="#b45309" stroke-opacity=".35" stroke-width="6"/>
  </g>
</svg>
